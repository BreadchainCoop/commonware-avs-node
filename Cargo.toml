[workspace]

[package]
name = "commonware-avs-node"
version = "0.1.0"
edition = "2024"

[dependencies]
commonware-avs-router = { git = "https://github.com/BreadchainCoop/commonware-avs-router", branch = "feat/update-dependencies" }

alloy = { version = "1.0.31" }
alloy-network = "1.0.31"
alloy-primitives = "1.0.31"
alloy-signer = "1.0.31"
alloy-signer-local = "1.0.31"
alloy-provider = "1.0.31"
anyhow = "1.0"
ark-bn254 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
bn254 = { git = "https://github.com/BreadchainCoop/bn254.git", branch = "feat/update-dependencies" }
bytes = "1.10.1"
clap = "4.5.37"
commonware-codec = "0.0.62"
commonware-cryptography = "0.0.62"
commonware-macros = "0.0.62"
commonware-p2p = "0.0.62"
commonware-runtime = "0.0.62"
commonware-utils = "0.0.62"
dotenv = "0.15.0"
eigen-crypto-bls = "2.0.0"
eigen-crypto-bn254 = "2.0.0"
eigen-logging = "1.0.0"
futures = "0.3.31"
futures-util = "0.3.31"
governor = "0.10.1"
prometheus-client = "0.24.0"
prost = "0.14.1"
rand = "0.9.1"
commonware-eigenlayer = { git = "https://github.com/BreadchainCoop/commonware-avs-network-lookup", branch = "update-dependencies" }
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = { version = "2.5.4", features = ["serde"] }
serde_json = "1.0.140"

[build-dependencies]
prost-build = "0.14.1"
